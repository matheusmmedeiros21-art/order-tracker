openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for HelpDesk IT ticketing system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tickets
    description: Support ticket operations
  - name: ai
    description: AI-powered features
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List all tickets
      description: Returns all tickets ordered by creation date (oldest first)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, done, all]
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [tickets]
      summary: Create a new support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketBody"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /tickets/stats:
    get:
      operationId: getTicketStats
      tags: [tickets]
      summary: Get ticket statistics
      description: Returns summary counts and metrics for the admin dashboard
      responses:
        "200":
          description: Ticket statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStats"

  /tickets/queue:
    get:
      operationId: getPublicQueue
      tags: [tickets]
      summary: Get the live public queue
      description: Public, non-PII queue snapshot for the live tracking page.
      responses:
        "200":
          description: Public queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQueue"

  /tickets/{id}/queue-position:
    get:
      operationId: getTicketQueuePosition
      tags: [tickets]
      summary: Get a ticket's current position in the queue
      description: Returns position by priority then arrival order. 0 means in_progress or done.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Queue position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketQueuePosition"
        "404":
          description: Ticket not found

  /tickets/{id}/ai-summary:
    post:
      operationId: getTicketAiSummary
      tags: [tickets]
      summary: Generate an AI summary of the ticket and screenshot
      description: Uses GPT vision to analyze the screenshot + description and produce a short admin-friendly diagnosis.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketAiSummary"
        "404":
          description: Ticket not found

  /tickets/{id}/ai-suggest-reply:
    post:
      operationId: getTicketAiSuggestedReply
      tags: [ai]
      summary: Suggest a reply to the ticket requester
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggested reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestedReply"
        "404":
          description: Ticket not found

  /ai/classify:
    post:
      operationId: aiClassifyTicket
      tags: [ai]
      summary: Auto-classify a ticket from its description (and optional screenshot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiClassifyBody"
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiClassifyResult"

  /ai/improve-description:
    post:
      operationId: aiImproveDescription
      tags: [ai]
      summary: Rewrite the user's description in clearer technical language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImproveBody"
      responses:
        "200":
          description: Improved description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiImproveResult"

  /ai/find-duplicates:
    post:
      operationId: aiFindDuplicates
      tags: [ai]
      summary: Find existing open tickets that look like the proposed new one
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFindDuplicatesBody"
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiFindDuplicatesResult"

  /ai/insights:
    get:
      operationId: aiGetInsights
      tags: [ai]
      summary: AI-generated dashboard insights for the admin
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsights"

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: FAQ chat assistant about IT support and the AnyDesk tutorial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: Reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResult"

  /tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get a single ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
    patch:
      operationId: updateTicket
      tags: [tickets]
      summary: Update a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketBody"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "404":
          description: Ticket not found
    delete:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Ticket deleted
        "404":
          description: Ticket not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Ticket:
      type: object
      properties:
        id:
          type: integer
        requesterName:
          type: string
        requesterEmail:
          type: string
          nullable: true
        description:
          type: string
        category:
          type: string
          enum: [computer, printer, network, software, phone, other]
        status:
          type: string
          enum: [pending, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: string
          nullable: true
        anydeskId:
          type: string
          nullable: true
        screenshotUrl:
          type: string
          nullable: true
        adminNotes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - requesterName
        - description
        - category
        - status
        - priority
        - createdAt
        - updatedAt

    CreateTicketBody:
      type: object
      properties:
        requesterName:
          type: string
        requesterEmail:
          type: string
          nullable: true
        description:
          type: string
        category:
          type: string
          enum: [computer, printer, network, software, phone, other]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: string
          nullable: true
        anydeskId:
          type: string
          nullable: true
        screenshotUrl:
          type: string
          nullable: true
      required:
        - requesterName
        - description
        - category
        - priority

    UpdateTicketBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        adminNotes:
          type: string
          nullable: true
        requesterName:
          type: string
        requesterEmail:
          type: string
          nullable: true
        description:
          type: string
        category:
          type: string
          enum: [computer, printer, network, software, phone, other]
        location:
          type: string
          nullable: true
        anydeskId:
          type: string
          nullable: true
        screenshotUrl:
          type: string
          nullable: true

    PublicQueueEntry:
      type: object
      description: Public, anonymized queue entry (no PII beyond first name). Priority is intentionally omitted — public queue is pure FIFO.
      properties:
        id:
          type: integer
        position:
          type: integer
          description: 1-based position. 0 means in_progress.
        status:
          type: string
          enum: [pending, in_progress]
        category:
          type: string
          enum: [computer, printer, network, software, phone, other]
        firstName:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - position
        - status
        - category
        - firstName
        - createdAt

    PublicQueue:
      type: object
      properties:
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PublicQueueEntry"
        inProgress:
          type: array
          items:
            $ref: "#/components/schemas/PublicQueueEntry"
        totals:
          type: object
          properties:
            pending:
              type: integer
            inProgress:
              type: integer
            doneToday:
              type: integer
          required: [pending, inProgress, doneToday]
      required: [pending, inProgress, totals]

    TicketQueuePosition:
      type: object
      description: Public queue snapshot. Intentionally omits PII so it can be polled without auth.
      properties:
        id:
          type: integer
        position:
          type: integer
          description: 1-based queue position; 0 if in_progress or done
        totalAhead:
          type: integer
        totalActive:
          type: integer
        status:
          type: string
          enum: [pending, in_progress, done]
      required:
        - id
        - position
        - totalAhead
        - totalActive
        - status

    TicketAiSummary:
      type: object
      properties:
        ticketId:
          type: integer
        summary:
          type: string
        diagnosis:
          type: string
        suggestedActions:
          type: array
          items:
            type: string
        severity:
          type: string
          enum: [low, medium, high, urgent]
        hasScreenshot:
          type: boolean
      required:
        - ticketId
        - summary
        - diagnosis
        - suggestedActions
        - severity
        - hasScreenshot

    AiClassifyBody:
      type: object
      properties:
        description:
          type: string
        screenshotUrl:
          type: string
          nullable: true
      required:
        - description

    AiClassifyResult:
      type: object
      properties:
        category:
          type: string
          enum: [computer, printer, network, software, phone, other]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        suggestedTitle:
          type: string
        reasoning:
          type: string
      required:
        - category
        - priority
        - suggestedTitle
        - reasoning

    AiImproveBody:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    AiImproveResult:
      type: object
      properties:
        improved:
          type: string
      required:
        - improved

    AiFindDuplicatesBody:
      type: object
      properties:
        description:
          type: string
        category:
          type: string
          nullable: true
      required:
        - description

    AiDuplicateMatch:
      type: object
      properties:
        ticketId:
          type: integer
        requesterName:
          type: string
        descriptionExcerpt:
          type: string
        status:
          type: string
        score:
          type: number
        reason:
          type: string
      required:
        - ticketId
        - requesterName
        - descriptionExcerpt
        - status
        - score
        - reason

    AiFindDuplicatesResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/AiDuplicateMatch"
      required:
        - matches

    AiSuggestedReply:
      type: object
      properties:
        ticketId:
          type: integer
        reply:
          type: string
      required:
        - ticketId
        - reply

    AiInsightItem:
      type: object
      properties:
        kind:
          type: string
          enum: [trend, alert, suggestion, summary]
        title:
          type: string
        body:
          type: string
        ticketIds:
          type: array
          items:
            type: integer
      required:
        - kind
        - title
        - body

    AiInsights:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        headline:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiInsightItem"
      required:
        - generatedAt
        - headline
        - items

    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    AiChatBody:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessage"
      required:
        - messages

    AiChatResult:
      type: object
      properties:
        reply:
          type: string
      required:
        - reply

    TicketStats:
      type: object
      properties:
        total:
          type: integer
        pending:
          type: integer
        inProgress:
          type: integer
        done:
          type: integer
        byCategory:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
            required:
              - category
              - count
        byPriority:
          type: array
          items:
            type: object
            properties:
              priority:
                type: string
              count:
                type: integer
            required:
              - priority
              - count
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
      required:
        - total
        - pending
        - inProgress
        - done
        - byCategory
        - byPriority
        - recentActivity
